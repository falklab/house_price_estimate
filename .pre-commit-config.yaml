# Install the hooks with: uv run pre-commit install
# Run on everything with: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # Runs the fast tests matching the changed files; see the script
      # docstring for how files are mapped to tests. CI runs everything.
      - id: pytest-changed
        name: pytest (tests for changed files)
        entry: uv run python scripts/pytest_changed.py
        language: system
        files: ^(house_price_estimate/|tests/)
        types: [python]
        stages: [pre-commit]

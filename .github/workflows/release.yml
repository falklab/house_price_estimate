name: Release

# release-please keeps a release PR open with the next version and
# CHANGELOG. Merging that PR tags the release and creates a GitHub
# Release, to which the built wheel and sdist are attached.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: astral-sh/setup-uv@v10.3.3
        if: ${{ steps.release.outputs.release_created }}
      - name: Build and attach distributions
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv build
          gh release upload "${{ steps.release.outputs.tag_name }}" dist/*

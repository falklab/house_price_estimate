version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    # Only update uv.lock; version ranges in pyproject.toml are set by hand
    # (e.g. upper caps) and raising lower bounds affects users
    versioning-strategy: lockfile-only
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
